<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChristLife Assemblies | Cebu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Montserrat:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
    }
    .font-serif {
      font-family: 'Merriweather', serif;
    }
    .hero-bg {
      background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('clacebu.jpg');
      background-size: cover;
      background-position: center;
      background-color: #4a5568;
    }
    .nav-link {
      transition: color 0.3s, border-bottom-color 0.3s;
    }
    .nav-link:hover {
      color: #d69e2e;
      border-bottom-color: #d69e2e;
    }
    .gallery-img {
      transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
    }
    .gallery-img:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1),
        0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }
    .talk-card-image {
      height: 12rem;
      width: 100%;
      object-fit: cover;
      border-top-left-radius: 0.5rem;
      border-top-right-radius: 0.5rem;
    }
    .talk-card-description {
      height: 4.5rem;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }
  </style>
</head>

<body class="bg-gray-50 text-gray-800">

  <!-- Header, hero, sections remain the same (unchanged) -->
  <!-- ... -->

  <!-- DYNAMIC RECENT TALKS SECTION -->
  <section id="sermons" class="py-20">
    <div class="container mx-auto px-6">
      <div class="text-center mb-12">
        <h2 class="text-3xl font-bold font-serif text-gray-800">Recent Talks</h2>
        <p class="text-gray-600 mt-2">Listen to messages of inspiration and truth.</p>
      </div>

      <div id="recent-talks-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <div id="recent-talks-loading" class="text-center col-span-full py-8">
          <i class="fas fa-spinner animate-spin text-yellow-500 text-4xl"></i>
          <p class="mt-2 text-gray-600">Loading recent talks...</p>
        </div>
      </div>

      <div class="mt-12 text-center">
        <a href="talks.html" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 px-8 rounded-full transition duration-300">View All Talks</a>
      </div>
    </div>
  </section>

  <!-- ... Other sections unchanged ... -->

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // ✅ Supabase setup
    const SUPABASE_URL = "https://upcjphjybqmwlwnhapht.supabase.co";
    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVwY2pwaGp5YnFtd2x3bmhhcGh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIyNjc3NDgsImV4cCI6MjA3Nzg0Mzc0OH0.MyBXSXaWrBGz8aWdUdaB-jwrlHvgloAvusL0a3gpsFA";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const recentTalksList = document.getElementById("recent-talks-list");
    const recentTalksLoading = document.getElementById("recent-talks-loading");

    // ✅ Load recent talks from Supabase
    async function loadRecentTalks() {
      try {
        const { data, error } = await supabase
          .from("talks")
          .select("*")
          .order("created_at", { ascending: false })
          .limit(6);

        if (error) throw error;
        recentTalksLoading.remove();

        if (!data || data.length === 0) {
          recentTalksList.innerHTML =
            '<p class="text-gray-500 text-center col-span-full">No talks available yet.</p>';
          return;
        }

        data.forEach((talk) => {
          const card = document.createElement("div");
          card.className = "bg-white rounded-lg shadow-lg overflow-hidden";

          // ✅ Use cover_url if available, else fallback
          const coverImage = talk.cover_url
            ? talk.cover_url
            : "https://placehold.co/600x400/e2e8f0/4a5568?text=No+Image";

          card.innerHTML = `
            <img src="${coverImage}" 
                 alt="${talk.title || "Talk Image"}" 
                 class="talk-card-image">
            <div class="p-4">
              <h3 class="text-xl font-bold mb-2">${talk.title || "Untitled"}</h3>
              <p class="text-sm text-gray-600 mb-1"><strong>Speaker:</strong> ${talk.speaker || "N/A"}</p>
              <p class="text-sm text-gray-600 mb-3"><strong>Date:</strong> ${talk.date || "No date"}</p>
              <p class="talk-card-description text-gray-700">${talk.description || ""}</p>
              ${
                talk.gdrive_link
                  ? `<a href="${talk.gdrive_link}" target="_blank" class="inline-block mt-3 text-yellow-600 font-bold hover:underline">Watch / Listen</a>`
                  : ""
              }
            </div>
          `;
          recentTalksList.appendChild(card);
        });
      } catch (err) {
        console.error("Error loading talks:", err);
        recentTalksLoading.innerHTML =
          '<p class="text-red-500 col-span-full">Error: Could not load talks. Please check Supabase configuration.</p>';
      }
    }

    loadRecentTalks();
  </script>
</body>
</html>
