<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | ChristLife Assemblies</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- 1. Import Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Montserrat', sans-serif; }
        .font-serif { font-family: 'Merriweather', serif; }
        .form-container { display: none; }
        .admin-panel { display: none; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="container mx-auto max-w-lg p-8">
        
        <!-- Loading Spinner -->
        <div id="loading" class="text-center">
            <i class="fas fa-spinner fa-spin text-4xl text-yellow-600"></i>
            <p class="mt-4 text-gray-700">Connecting...</p>
        </div>

        <!-- Login Form -->
        <div id="login-form" class="form-container bg-white p-8 rounded-lg shadow-md">
            <h2 class="text-3xl font-bold font-serif text-center mb-6">Admin Portal Login</h2>
            
            <div id="auth-error" class="hidden text-red-600 bg-red-100 border border-red-400 p-3 rounded-md mb-4"></div>

            <button id="google-login-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg flex items-center justify-center transition duration-300">
                <i class="fab fa-google mr-2"></i> Sign in with Google
            </button>
            
            <div class="my-6 flex items-center justify-center">
                <span class="border-b w-1/3 lg:w-1/4"></span>
                <span class="text-xs text-center text-gray-500 uppercase mx-3">Or</span>
                <span class="border-b w-1/3 lg:w-1/4"></span>
            </div>

            <form id="email-login-form">
                <div class="mb-4">
                    <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                    <input type="email" id="email" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                </div>
                <div class="mb-6">
                    <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                    <input type="password" id="password" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline" required>
                </div>
                <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 px-4 rounded-lg transition duration-300">
                    Sign In with Email
                </button>
            </form>
        </div>

        <!-- Admin Panel (Shown after login) -->
        <div id="admin-panel" class="admin-panel">
            <div class="bg-white p-8 rounded-lg shadow-md">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-3xl font-bold font-serif">Admin Panel</h2>
                    <button id="logout-btn" class="text-sm text-red-500 hover:text-red-700 font-semibold">
                        Sign Out <i class="fas fa-sign-out-alt ml-1"></i>
                    </button>
                </div>
                <p class="mb-2">Logged in as: <strong id="admin-email" class="font-mono">...</strong></p>
                <p class="mb-6 text-green-700 font-semibold"><i class="fas fa-check-circle mr-1"></i> You are an authorized admin.</p>
                
                <hr class="my-6">
                
                <h3 class="text-2xl font-bold font-serif mb-4">Add a New Talk</h3>
                <div id="add-talk-message" class="hidden p-3 rounded-md mb-4"></div>
                
                <form id="add-talk-form">
                    <div class="mb-4">
                        <label for="talk-title" class="block text-gray-700 text-sm font-bold mb-2">Talk Title</label>
                        <input type="text" id="talk-title" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" required>
                    </div>
                    <div class="mb-4">
                        <label for="talk-speaker" class="block text-gray-700 text-sm font-bold mb-2">Speaker</label>
                        <input type="text" id="talk-speaker" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" required>
                    </div>
                    <div class="mb-4">
                        <label for="talk-date" class="block text-gray-700 text-sm font-bold mb-2">Date (e.g., August 31, 2025)</label>
                        <input type="text" id="talk-date" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" required>
                    </div>
                    <div class="mb-4">
                        <label for="talk-description" class="block text-gray-700 text-sm font-bold mb-2">Description (Optional)</label>
                        <textarea id="talk-description" rows="3" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700"></textarea>
                    </div>
                    <div class="mb-4">
                        <label for="talk-gdrive" class="block text-gray-700 text-sm font-bold mb-2">Google Drive Share Link</label>
                        <input type="url" id="talk-gdrive" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" required>
                    </div>
                    <div class="mb-4">
                        <label for="talk-cover" class="block text-gray-700 text-sm font-bold mb-2">Cover Photo URL</label>
                        <input type="url" id="talk-cover" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" required>
                    </div>
                    
                    <button type="submit" id="add-talk-btn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 flex items-center justify-center">
                        <span id="add-talk-text">Add Talk to Website</span>
                        <i id="add-talk-spinner" class="fas fa-spinner fa-spin hidden ml-2"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        // 2. Initialize Supabase
        let supabase = null;
        try {
            // Use Netlify variables (VITE_)
            const supabaseUrl = typeof VITE_SUPABASE_URL !== 'undefined'
                ? VITE_SUPABASE_URL
                : (typeof __app_id !== 'undefined' ? "https_preview_id.supabase.co" : "YOUR_SUPABASE_URL"); // Fallback for preview
                
            const supabaseAnonKey = typeof VITE_SUPABASE_ANON_KEY !== 'undefined'
                ? VITE_SUPABASE_ANON_KEY
                : (typeof __firebase_config !== 'undefined' ? "preview_key" : "YOUR_SUPABASE_ANON_KEY"); // Fallback for preview

            if (supabaseUrl === "YOUR_SUPABASE_URL" || supabaseAnonKey === "YOUR_SUPABASE_ANON_KEY") {
                throw new Error("Supabase environment variables not set. Please check your Netlify config.");
            }
            
            supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);
        } catch (error) {
            console.error("Supabase init error:", error.message);
            const loadingEl = document.getElementById('loading');
            loadingEl.innerHTML = `<p class="text-red-600"><strong>Error:</strong> Could not connect to backend. Please check Netlify environment variables.</p>`;
            return;
        }

        // --- UI Elements ---
        const loadingEl = document.getElementById('loading');
        const loginFormEl = document.getElementById('login-form');
        const adminPanelEl = document.getElementById('admin-panel');
        const authErrorEl = document.getElementById('auth-error');
        const adminEmailEl = document.getElementById('admin-email');
        const addTalkForm = document.getElementById('add-talk-form');
        const addTalkMessageEl = document.getElementById('add-talk-message');
        const addTalkBtn = document.getElementById('add-talk-btn');
        const addTalkText = document.getElementById('add-talk-text');
        const addTalkSpinner = document.getElementById('add-talk-spinner');

        // --- Helper Functions ---
        function showAuthError(message) {
            authErrorEl.textContent = message;
            authErrorEl.classList.remove('hidden');
        }

        function showTalkMessage(message, isSuccess = true) {
            addTalkMessageEl.textContent = message;
            addTalkMessageEl.className = `p-3 rounded-md mb-4 ${isSuccess ? 'bg-green-100 text-green-700 border border-green-300' : 'bg-red-100 text-red-700 border border-red-300'}`;
        }

        function setLoading(isLoading) {
            if (isLoading) {
                addTalkText.textContent = "Adding...";
                addTalkSpinner.classList.remove('hidden');
                addTalkBtn.disabled = true;
            } else {
                addTalkText.textContent = "Add Talk to Website";
                addTalkSpinner.classList.add('hidden');
                addTalkBtn.disabled = false;
            }
        }

        // --- Admin Check ---
        async function checkAdminStatus(user) {
            try {
                // Check the 'admins' table to see if the user's email is on the whitelist.
                const { data, error } = await supabase
                    .from('admins')
                    .select('email')
                    .eq('email', user.email)
                    .single(); // Get a single record

                if (error) {
                    if (error.code === 'PGRST116') {
                        // "PGRST116" means "no rows returned"
                        return false; // User is not in the admins table
                    }
                    throw error; // Throw other errors
                }
                
                return !!data; // If data exists, they are an admin.
            } catch (error) {
                console.error('Error checking admin status:', error);
                // This error (e.g., 404 table not found, or RLS policy violation) is a setup problem.
                showAuthError(`Admin Check Failed: ${error.message}. Ensure 'admins' table and RLS policies are set up.`);
                await supabase.auth.signOut();
                return false;
            }
        }

        // --- Auth Logic ---
        async function handleLogin(user) {
            const isAdmin = await checkAdminStatus(user);
            
            if (isAdmin) {
                adminEmailEl.textContent = user.email;
                loginFormEl.style.display = 'none';
                adminPanelEl.style.display = 'block';
                loadingEl.style.display = 'none';
            } else {
                await supabase.auth.signOut();
                showAuthError("Access Denied: Your account is not on the admin whitelist.");
                loginFormEl.style.display = 'block';
                adminPanelEl.style.display = 'none';
                loadingEl.style.display = 'none';
            }
        }

        // 1. Google Login
        document.getElementById('google-login-btn').addEventListener('click', async () => {
            authErrorEl.classList.add('hidden');
            const { data, error } = await supabase.auth.signInWithOAuth({
                provider: 'google'
            });
            if (error) {
                showAuthError(`Google Sign-in failed: ${error.message}`);
            }
        });

        // 2. Email Login
        document.getElementById('email-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            authErrorEl.classList.add('hidden');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                showAuthError(error.message);
            } else if (data.user) {
                // Don't show admin panel yet, wait for session listener
                loadingEl.style.display = 'block';
                loginFormEl.style.display = 'none';
                // The onAuthStateChange listener will handle the admin check
            }
        });

        // 3. Logout
        document.getElementById('logout-btn').addEventListener('click', async ()_=> {
            await supabase.auth.signOut();
            // Listener will hide panel and show login
        });

        // --- Add Talk Logic ---
        addTalkForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            setLoading(true);

            const talk = {
                title: document.getElementById('talk-title').value,
                speaker: document.getElementById('talk-speaker').value,
                date: document.getElementById('talk-date').value,
                description: document.getElementById('talk-description').value,
                gdrive_link: document.getElementById('talk-gdrive').value,
                cover_photo_url: document.getElementById('talk-cover').value,
                // created_at is set by default in Supabase table
            };

            const { error } = await supabase.from('talks').insert(talk);

            if (error) {
                showTalkMessage(`Error: ${error.message}`, false);
            } else {
                showTalkMessage('Success! The new talk has been added to the website.', true);
                addTalkForm.reset();
            }
            setLoading(false);
        });

        // --- Session Management ---
        // This is the main function that runs on page load and on login/logout
        supabase.auth.onAuthStateChange((event, session) => {
            if (session && session.user) {
                // User is logged in
                handleLogin(session.user);
            } else {
                // User is logged out
                loginFormEl.style.display = 'block';
                adminPanelEl.style.display = 'none';
                loadingEl.style.display = 'none';
            }
        });

    </script>
</body>
</html>
