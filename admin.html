<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal | ChristLife Assemblies</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Montserrat', sans-serif; }
    .font-serif { font-family: 'Merriweather', serif; }
    .btn-main { background-color: #facc15; color: white; font-weight: bold; }
    .btn-main:hover { background-color: #eab308; }
    .link { color: #2563eb; cursor: pointer; }
    .link:hover { text-decoration: underline; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800">

  <header class="bg-white shadow-md">
    <div class="container mx-auto px-6 py-4">
      <h1 class="text-3xl font-bold text-gray-800 font-serif">Admin Portal</h1>
      <p class="text-gray-600">ChristLife Assemblies Cebu - Talk Management</p>
    </div>
  </header>

  <main class="container mx-auto p-6">

    <!-- Login Form -->
    <div id="login-container" class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md">
      <h2 class="text-2xl font-bold font-serif mb-6 text-center">Admin Login</h2>
      <form id="login-form">
        <div class="mb-4">
          <label class="block text-sm font-bold mb-2">Email:</label>
          <input type="email" id="login-email" class="border rounded w-full py-2 px-3" required />
        </div>
        <div class="mb-6">
          <label class="block text-sm font-bold mb-2">Password:</label>
          <input type="password" id="login-password" class="border rounded w-full py-2 px-3" required />
        </div>
        <button type="submit" class="btn-main py-2 px-4 rounded-full w-full transition">Login</button>
      </form>
      <p id="login-error" class="text-red-500 text-center mt-4"></p>
      <p class="text-center text-sm mt-4">Don't have an account? 
        <span id="show-register" class="link">Register</span>
      </p>
    </div>

    <!-- Registration Form -->
    <div id="register-container" class="hidden max-w-md mx-auto bg-white p-8 rounded-lg shadow-md">
      <h2 class="text-2xl font-bold font-serif mb-6 text-center">Register</h2>
      <form id="register-form">
        <div class="mb-4">
          <label class="block text-sm font-bold mb-2">Email:</label>
          <input type="email" id="register-email" class="border rounded w-full py-2 px-3" required />
        </div>
        <div class="mb-4">
          <label class="block text-sm font-bold mb-2">Password:</label>
          <input type="password" id="register-password" class="border rounded w-full py-2 px-3" required />
        </div>
        <div class="mb-6">
          <label class="block text-sm font-bold mb-2">Confirm Password:</label>
          <input type="password" id="register-confirm" class="border rounded w-full py-2 px-3" required />
        </div>
        <button type="submit" class="btn-main py-2 px-4 rounded-full w-full transition">Create Account</button>
      </form>
      <p id="register-error" class="text-red-500 text-center mt-4"></p>
      <p id="register-success" class="text-green-600 text-center mt-4"></p>
      <p class="text-center text-sm mt-4">Already have an account? 
        <span id="show-login" class="link">Login</span>
      </p>
    </div>

    <!-- Admin Panel -->
    <div id="admin-content" class="hidden max-w-xl mx-auto bg-white p-8 rounded-lg shadow-md">
      <div class="flex justify-between items-center mb-6">
        <div>
          <h2 class="text-2xl font-bold font-serif">Add New Talk</h2>
          <p id="admin-email" class="text-sm text-gray-500"></p>
        </div>
        <button id="logout-button" class="bg-gray-500 hover:bg-gray-600 text-white text-sm font-bold py-2 px-4 rounded-full">Logout</button>
      </div>

      <form id="add-talk-form">
        <div class="mb-4">
          <label class="block text-sm font-bold mb-2">Talk Title:</label>
          <input type="text" id="talk-title" class="border rounded w-full py-2 px-3" required />
        </div>
        <div class="mb-4">
          <label class="block text-sm font-bold mb-2">Speaker Name:</label>
          <input type="text" id="speaker-name" class="border rounded w-full py-2 px-3" required />
        </div>
        <div class="mb-4">
          <label class="block text-sm font-bold mb-2">Talk Date:</label>
          <input type="date" id="talk-date" class="border rounded w-full py-2 px-3" required />
        </div>
        <div class="mb-4">
          <label class="block text-sm font-bold mb-2">Description:</label>
          <textarea id="talk-description" rows="3" class="border rounded w-full py-2 px-3" required></textarea>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-bold mb-2">Google Drive Link:</label>
          <input type="url" id="gdrive-link" class="border rounded w-full py-2 px-3" required />
        </div>
        <button type="submit" class="btn-main py-2 px-4 rounded-full w-full">Add Talk</button>
        <p id="form-success" class="text-green-600 text-center mt-4"></p>
        <p id="form-error" class="text-red-500 text-center mt-4"></p>
      </form>
    </div>

  </main>

  <script type="module">
    const SUPABASE_URL = "https://upcjphjybqmwlwnhapht.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVwY2pwaGp5YnFtd2x3bmhhcGh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIyNjc3NDgsImV4cCI6MjA3Nzg0Mzc0OH0.MyBXSXaWrBGz8aWdUdaB-jwrlHvgloAvusL0a3gpsFA";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginContainer = document.getElementById('login-container');
    const registerContainer = document.getElementById('register-container');
    const adminContent = document.getElementById('admin-content');
    const adminEmail = document.getElementById('admin-email');
    const showRegister = document.getElementById('show-register');
    const showLogin = document.getElementById('show-login');

    // Switch between login/register
    showRegister.addEventListener('click', () => {
      loginContainer.classList.add('hidden');
      registerContainer.classList.remove('hidden');
    });
    showLogin.addEventListener('click', () => {
      registerContainer.classList.add('hidden');
      loginContainer.classList.remove('hidden');
    });

    // Login
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      document.getElementById('login-error').textContent = error ? error.message : '';
    });

    // Register
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('register-email').value;
      const password = document.getElementById('register-password').value;
      const confirm = document.getElementById('register-confirm').value;
      const registerError = document.getElementById('register-error');
      const registerSuccess = document.getElementById('register-success');

      if (password !== confirm) {
        registerError.textContent = "Passwords do not match.";
        return;
      }

      const { error } = await supabase.auth.signUp({ email, password });
      if (error) {
        registerError.textContent = error.message;
        registerSuccess.textContent = '';
      } else {
        registerError.textContent = '';
        registerSuccess.textContent = "Account created! You can now log in.";
      }
    });

    // Auth listener
    supabase.auth.onAuthStateChange(async (event, session) => {
      if (session?.user) {
        loginContainer.classList.add('hidden');
        registerContainer.classList.add('hidden');
        adminContent.classList.remove('hidden');
        adminEmail.textContent = `Logged in as: ${session.user.email}`;
      } else {
        loginContainer.classList.remove('hidden');
        adminContent.classList.add('hidden');
      }
    });

    // Logout
    document.getElementById('logout-button').addEventListener('click', async () => {
      await supabase.auth.signOut();
    });

    // Add Talk with RLS-safe insert
    document.getElementById('add-talk-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        document.getElementById('form-error').textContent = "You must be logged in to add a talk.";
        return;
      }

      const talkData = {
        title: document.getElementById('talk-title').value,
        speaker: document.getElementById('speaker-name').value,
        date: document.getElementById('talk-date').value,
        description: document.getElementById('talk-description').value,
        gdrive_link: document.getElementById('gdrive-link').value,
        user_id: session.user.id // ✅ Ensure it matches your RLS policy
      };

      const { error } = await supabase.from('talks').insert(talkData);
      const success = document.getElementById('form-success');
      const fail = document.getElementById('form-error');

      if (error) {
        fail.textContent = error.message;
        success.textContent = '';
      } else {
        success.textContent = 'Talk added successfully!';
        fail.textContent = '';
        e.target.reset();
      }
    });
  </script>
</body>
</html>
