<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | ChristLife Assemblies</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; }
        .font-serif { font-family: 'Merriweather', serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <header class="bg-white shadow-md">
        <div class="container mx-auto px-6 py-4">
            <h1 class="text-3xl font-bold text-gray-800 font-serif">Admin Portal</h1>
            <p class="text-gray-600">ChristLife Assemblies Cebu - Talk Management</p>
        </div>
    </header>

    <main class="container mx-auto p-6">

        <!-- Login Form -->
        <div id="login-container" class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md">
            <h2 class="text-2xl font-bold font-serif mb-6 text-center">Admin Login</h2>
            <form id="login-form">
                <div class="mb-4">
                    <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Email:</label>
                    <input type="email" id="email" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                </div>
                <div class="mb-6">
                    <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Password:</label>
                    <input type="password" id="password" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                </div>
                <button type="submit" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 px-4 rounded-full w-full transition duration-300">Login</button>
                <p id="login-error" class="text-red-500 text-xs italic mt-4 text-center"></p>
                <p class="text-center text-sm text-gray-600 mt-4">
                    Don't have an account? 
                    <a href="#" id="show-register-link" class="font-medium text-yellow-600 hover:text-yellow-500">
                        Register here
                    </a>
                </p>
            </form>
        </div>

        <!-- Registration Form (Hidden by default) -->
        <div id="register-container" class="hidden max-w-md mx-auto bg-white p-8 rounded-lg shadow-md">
            <h2 class="text-2xl font-bold font-serif mb-6 text-center">Admin Registration</h2>
            <form id="register-form">
                <div class="mb-4">
                    <label for="register-email" class="block text-gray-700 text-sm font-bold mb-2">Email:</label>
                    <input type="email" id="register-email" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                </div>
                <div class="mb-4">
                    <label for="register-password" class="block text-gray-700 text-sm font-bold mb-2">Password (min. 6 characters):</label>
                    <input type="password" id="register-password" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                </div>
                <div class="mb-4">
                    <label for="confirm-password" class="block text-gray-700 text-sm font-bold mb-2">Confirm Password:</label>
                    <input type="password" id="confirm-password" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                </div>
                <div class="mb-6">
                    <label for="register-secret" class="block text-gray-700 text-sm font-bold mb-2">Registration Secret:</label>
                    <input type="password" id="register-secret" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                    <p class="text-xs text-gray-500 mt-1">A secret key is required to create an admin account.</p>
                </div>
                <button type="submit" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 px-4 rounded-full w-full transition duration-300">Register</button>
                <p id="register-error" class="text-red-500 text-xs italic mt-4 text-center"></p>
                <p id="register-success" class="text-green-600 text-xs italic mt-4 text-center"></p>
                <p class="text-center text-sm text-gray-600 mt-4">
                    Already have an account? 
                    <a href="#" id="show-login-link" class="font-medium text-yellow-600 hover:text-yellow-500">
                        Login here
                    </a>
                </p>
            </form>
        </div>

        <!-- Admin Content (Hidden by default) -->
        <div id="admin-content" class="hidden max-w-xl mx-auto">
            <div class="bg-white p-8 rounded-lg shadow-md">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold font-serif">Add New Talk</h2>
                    <button id="logout-button" class="bg-gray-500 hover:bg-gray-600 text-white text-sm font-bold py-2 px-4 rounded-full transition duration-300">Logout</button>
                </div>
                <form id="add-talk-form">
                    <div class="mb-4">
                        <label for="talk-title" class="block text-gray-700 text-sm font-bold mb-2">Talk Title:</label>
                        <input type="text" id="talk-title" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                    </div>
                    <div class="mb-4">
                        <label for="speaker-name" class="block text-gray-700 text-sm font-bold mb-2">Speaker Name:</label>
                        <input type="text" id="speaker-name" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                    </div>
                    <div class="mb-4">
                        <label for="talk-date" class="block text-gray-700 text-sm font-bold mb-2">Talk Date:</label>
                        <input type="date" id="talk-date" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                    </div>
                    <div class="mb-4">
                        <label for="talk-description" class="block text-gray-700 text-sm font-bold mb-2">Description:</label>
                        <textarea id="talk-description" rows="3" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required></textarea>
                    </div>
                    <div class="mb-4">
                        <label for="gdrive-link" class="block text-gray-700 text-sm font-bold mb-2">Google Drive Share Link:</label>
                        <input type="url" id="gdrive-link" placeholder="https://drive.google.com/..." class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                    </div>
                    <div class="mb-4">
                        <label for="cover-photo-url" class="block text-gray-700 text-sm font-bold mb-2">Cover Photo URL:</label>
                        <input type="url" id="cover-photo-url" placeholder="https://i.imgbb.com/.../image.png" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                        <p class="text-xs text-gray-500 mt-1">Optional. Upload to <a href="https://imgbb.com/" target="_blank" class="text-blue-500 hover:underline">imgbb.com</a> and paste the direct link here.</p>
                    </div>
                    <button type="submit" id="submit-talk-button" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 px-6 rounded-full w-full transition duration-300">
                        Add Talk to Website
                    </button>
                    <!-- Status message -->
                    <div id="upload-status" class="hidden text-center mt-4 text-blue-600"></div>
                </form>
                <p id="form-success" class="text-green-600 text-center mt-4"></p>
                <p id="form-error" class="text-red-500 text-center mt-4"></p>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            onAuthStateChanged, 
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword, // Added for registration
            signOut,
            signInAnonymously,
            signInWithCustomToken
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            serverTimestamp, 
            setLogLevel 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- IMPORTANT: REGISTRATION SECRET ---
        // !! CHANGE THIS VALUE to a strong, unique password !!
        // This is the "secret key" users must enter to register.
        const REGISTRATION_SECRET = "clacebu"; 
        // Example: "MySuperSecretKey123!"

        // --- Firebase Config (UPDATED) ---
        // This logic now checks for Netlify variables (VITE_) first,
        // and falls back to Canvas variables (__).
        const configStr = typeof VITE_FIREBASE_CONFIG !== 'undefined'
            ? VITE_FIREBASE_CONFIG
            : (typeof __firebase_config !== 'undefined' ? __firebase_config : 'null');
            
        const firebaseConfig = JSON.parse(configStr) || {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        // This logic now checks for Netlify variables (VITE_) first
        const appId = typeof VITE_APP_ID !== 'undefined'
            ? VITE_APP_ID
            : (typeof __app_id !== 'undefined' ? __app_id : 'default-app-id');

        // --- Initialize Firebase ---
        let app;
        let auth;
        let db;

        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            setLogLevel('Debug');
        } catch (error) {
            console.error("Firebase initialization failed:", error);
            // Display a user-friendly error on the page
            const loginContainer = document.getElementById('login-container');
            if (loginContainer) {
                loginContainer.innerHTML = `<p class="text-red-500 text-center font-bold">Error: Could not connect to Firebase. Please check your Netlify environment variables and re-deploy.</p>`;
            }
        }
        
        // --- UI Elements ---
        const loginContainer = document.getElementById('login-container');
        const registerContainer = document.getElementById('register-container'); // Added
        const adminContent = document.getElementById('admin-content');
        
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const registerForm = document.getElementById('register-form'); // Added
        const registerError = document.getElementById('register-error'); // Added
        const registerSuccess = document.getElementById('register-success'); // Added

        const showRegisterLink = document.getElementById('show-register-link'); // Added
        const showLoginLink = document.getElementById('show-login-link'); // Added
        
        const logoutButton = document.getElementById('logout-button');
        const addTalkForm = document.getElementById('add-talk-form');
        const formSuccess = document.getElementById('form-success');
        const formError = document.getElementById('form-error');
        const submitTalkButton = document.getElementById('submit-talk-button');
        const uploadStatus = document.getElementById('upload-status');

        // --- Form Toggle Logic ---
        if (showRegisterLink) {
            showRegisterLink.addEventListener('click', (e) => {
                e.preventDefault();
                loginContainer.classList.add('hidden');
                registerContainer.classList.remove('hidden');
            });
        }

        if (showLoginLink) {
            showLoginLink.addEventListener('click', (e) => {
                e.preventDefault();
                loginContainer.classList.remove('hidden');
                registerContainer.classList.add('hidden');
            });
        }

        // --- Auth State Logic ---
        if (auth) {
            onAuthStateChanged(auth, async (user) => {
                if (user && !user.isAnonymous) {
                    // User is logged in
                    loginContainer.classList.add('hidden');
                    registerContainer.classList.add('hidden'); // Hide register form too
                    adminContent.classList.remove('hidden');
                } else {
                    // User is logged out or anonymous
                    loginContainer.classList.remove('hidden'); // Show login form
                    adminContent.classList.add('hidden');
                    
                    try {
                        if (typeof __initial_auth_token !== 'undefined') {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else if (auth.currentUser === null) { 
                            await signInAnonymously(auth);
                            console.log("Signed in anonymously to check connection.");
                        }
                    } catch (error) {
                        console.error("Anonymous/Custom token sign-in failed:", error.message);
                        if (error.code === 'auth/api-key-not-valid' && loginError) {
                           loginError.textContent = "Auth Error: Invalid API Key. Check Netlify variables.";
                        }
                    }
                }
            });
        }

        // --- Login Form Submit ---
        if(loginForm) {
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                loginError.textContent = '';
                const email = loginForm['email'].value;
                const password = loginForm['password'].value;

                try {
                    await signInWithEmailAndPassword(auth, email, password);
                    // Auth state change will handle UI
                } catch (error) {
                    console.error("Login failed:", error);
                    loginError.textContent = "Login failed. Please check your email and password.";
                }
            });
        }

        // --- Registration Form Submit ---
        if (registerForm) {
            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                registerError.textContent = '';
                registerSuccess.textContent = '';

                const email = registerForm['register-email'].value;
                const password = registerForm['register-password'].value;
                const confirmPassword = registerForm['confirm-password'].value;
                const secret = registerForm['register-secret'].value;

                // 1. Check Secret Key
                if (secret !== REGISTRATION_SECRET) {
                    registerError.textContent = 'Incorrect Registration Secret. Account not created.';
                    return;
                }

                // 2. Check Passwords
                if (password !== confirmPassword) {
                    registerError.textContent = 'Passwords do not match.';
                    return;
                }

                // 3. Create User
                try {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    console.log('Successfully registered user:', userCredential.user.email);
                    registerSuccess.textContent = 'Registration successful! You will be logged in automatically.';
                    // Auth state change will automatically log them in and show admin panel.
                    registerForm.reset();

                } catch (error) {
                    console.error("Registration failed:", error);
                    if (error.code === 'auth/weak-password') {
                        registerError.textContent = 'Password is too weak (must be at least 6 characters).';
                    } else if (error.code === 'auth/email-already-in-use') {
                        registerError.textContent = 'This email is already in use.';
                    } else {
                        registerError.textContent = 'Registration failed. Please try again.';
                    }
                }
            });
        }

        // --- Logout Button ---
        if(logoutButton) {
            logoutButton.addEventListener('click', async () => {
                try {
                    await signOut(auth);
                    // Auth state change will handle UI and sign back in anonymously
                } catch (error) {
                    console.error("Logout failed:", error);
                }
            });
        }

        // --- Add Talk Form Submit ---
        if(addTalkForm) {
            addTalkForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                formSuccess.textContent = '';
                formError.textContent = '';
                submitTalkButton.disabled = true;
                uploadStatus.textContent = 'Saving talk...';
                uploadStatus.classList.remove('hidden');

                try {
                    const coverPhotoURL = addTalkForm['cover-photo-url'].value || null;
                    const talkData = {
                        title: addTalkForm['talk-title'].value,
                        speaker: addTalkForm['speaker-name'].value,
                        date: addTalkForm['talk-date'].value,
                        description: addTalkForm['talk-description'].value,
                        gdrive_link: addTalkForm['gdrive-link'].value,
                        coverPhotoURL: coverPhotoURL,
                        createdAt: serverTimestamp()
                    };

                    const docRef = await addDoc(collection(db, `artifacts/${appId}/public/data/talks`), talkData);
                    
                    formSuccess.textContent = 'Talk added successfully!';
                    addTalkForm.reset();
                    console.log("Document written with ID: ", docRef.id);
                    
                    setTimeout(() => { formSuccess.textContent = ''; }, 3000);

                } catch (error) {
                    console.error("Error adding document: ", error);
                    formError.textContent = 'Error adding talk. Please try again.';
                } finally {
                    submitTalkButton.disabled = false;
                    uploadStatus.classList.add('hidden');
                    uploadStatus.textContent = '';
                }
            });
        }

    </script>
</body>
</html>
