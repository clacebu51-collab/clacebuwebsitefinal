<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talks | ChristLife Assemblies Cebu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Montserrat', sans-serif; }
    .font-serif { font-family: 'Merriweather', serif; }
    .nav-link { transition: color 0.3s, border-bottom-color 0.3s; }
    .nav-link:hover { color: #d69e2e; border-bottom-color: #d69e2e; }
    .nav-link.active { color: #d69e2e; border-bottom-color: #d69e2e; }
    .talk-card-image {
      height: 12rem;
      width: 100%;
      object-fit: cover;
      border-top-left-radius: 0.5rem;
      border-top-right-radius: 0.5rem;
    }
    .talk-card-description {
      min-height: 4.5rem;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Header -->
  <header class="bg-white shadow-md sticky top-0 z-50">
    <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
      <a href="index.html" class="flex items-center">
        <img src="logoooo onlyyy.png" alt="ChristLife Assemblies Logo" class="h-10 w-10 mr-3 rounded-full" onerror="this.onerror=null;this.src='https://placehold.co/40x40/d69e2e/ffffff?text=Logo';">
        <span class="text-2xl font-bold text-gray-800 font-serif">ChristLife Assemblies Cebu</span>
      </a>
      <div class="hidden md:flex space-x-8">
        <a href="index.html#about" class="nav-link text-gray-600 border-b-2 border-transparent">About Us</a>
        <a href="talks.html" class="nav-link text-gray-600 border-b-2 border-transparent active">Talks</a>
        <a href="evangelism.html" class="nav-link text-gray-600 border-b-2 border-transparent">Evangelism</a>
        <a href="index.html#events" class="nav-link text-gray-600 border-b-2 border-transparent">Events</a>
        <a href="index.html#gallery" class="nav-link text-gray-600 border-b-2 border-transparent">Gallery</a>
        <a href="index.html#contact" class="nav-link text-gray-600 border-b-2 border-transparent">Contact</a>
      </div>
      <button id="mobile-menu-button" class="md:hidden focus:outline-none">
        <i class="fas fa-bars text-2xl"></i>
      </button>
    </nav>
    <div id="mobile-menu" class="hidden md:hidden">
      <a href="index.html#about" class="block py-2 px-4 text-sm hover:bg-gray-100">About Us</a>
      <a href="talks.html" class="block py-2 px-4 text-sm hover:bg-gray-100">Talks</a>
      <a href="evangelism.html" class="block py-2 px-4 text-sm hover:bg-gray-100">Evangelism</a>
      <a href="index.html#events" class="block py-2 px-4 text-sm hover:bg-gray-100">Events</a>
      <a href="index.html#gallery" class="block py-2 px-4 text-sm hover:bg-gray-100">Gallery</a>
      <a href="index.html#contact" class="block py-2 px-4 text-sm hover:bg-gray-100">Contact</a>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="py-20 bg-yellow-50 text-center">
    <h1 class="text-4xl font-bold font-serif text-gray-800">All Talks</h1>
    <p class="text-gray-600 mt-2">Browse our full archive of past messages.</p>
  </section>

  <!-- Talks List -->
  <section class="py-20">
    <div class="container mx-auto px-6">
      <div id="all-talks-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
      <div id="talks-error" class="hidden text-center text-red-600 bg-red-100 border border-red-400 p-4 rounded-md mt-6">
        Error loading talks. Please try again later.
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-gray-800 text-white">
    <div class="container mx-auto px-6 py-8 flex flex-col md:flex-row justify-between items-center">
      <p>© 2025 ChristLife Assemblies Cebu. All Rights Reserved.</p>
      <div class="flex space-x-6 mt-4 md:mt-0">
        <a href="https://www.facebook.com/ChristlifeAssembliesCebu" target="_blank" class="text-gray-400 hover:text-white"><i class="fab fa-facebook-f"></i></a>
        <a href="#" class="text-gray-400 hover:text-white"><i class="fab fa-youtube"></i></a>
        <a href="#" class="text-gray-400 hover:text-white"><i class="fab fa-instagram"></i></a>
      </div>
    </div>
  </footer>

  <script>
    // Mobile menu toggle
    document.getElementById("mobile-menu-button").addEventListener("click", () => {
      document.getElementById("mobile-menu").classList.toggle("hidden");
    });
  </script>

  <!-- ✅ SUPABASE FETCH SCRIPT -->
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://upcjphjybqmwlwnhapht.supabase.co";
    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVwY2pwaGp5YnFtd2x3bmhhcGh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIyNjc3NDgsImV4cCI6MjA3Nzg0Mzc0OH0.MyBXSXaWrBGz8aWdUdaB-jwrlHvgloAvusL0a3gpsFA";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const allTalksList = document.getElementById("all-talks-list");
    const talksError = document.getElementById("talks-error");

    // Format date nicely
    function formatTalkDate(dateString) {
      if (!dateString) return "Undated";
      const date = new Date(dateString);
      return date.toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
    }

    async function loadTalks() {
      try {
        const { data: talks, error } = await supabase
          .from("talks")
          .select("*")
          .order("created_at", { ascending: false });

        if (error) throw error;

        if (!talks || talks.length === 0) {
          allTalksList.innerHTML = `<p class="text-center text-gray-600 col-span-3">No talks available yet.</p>`;
          return;
        }

        talks.forEach((talk) => {
          const title = talk.title || "Untitled Talk";
          const imageURL =
            talk.cover_url ||
            talk.cover_photo_u ||
            `https://placehold.co/600x400/d69e2e/ffffff?text=${encodeURIComponent(title)}`;

          const talkCard = document.createElement("div");
          talkCard.className = "bg-white rounded-lg shadow-lg overflow-hidden flex flex-col";

          talkCard.innerHTML = `
            <img src="${imageURL}" alt="${title}" class="talk-card-image" onerror="this.src='https://placehold.co/600x400/d69e2e/ffffff?text=No+Image';">
            <div class="p-6 flex flex-col flex-grow">
              <h3 class="font-bold text-xl mb-2 font-serif">${title}</h3>
              <p class="text-gray-500 text-sm mb-3">${talk.speaker || "Unknown Speaker"} | ${formatTalkDate(talk.date)}</p>
              <p class="text-gray-700 mb-4 talk-card-description">${talk.description || "No description available."}</p>
              ${
                talk.gdrive_link
                  ? `<a href="${talk.gdrive_link}" target="_blank" class="text-yellow-600 font-semibold hover:text-yellow-700 mt-auto">
                       Listen Now <i class="fas fa-arrow-right ml-1"></i></a>`
                  : ""
              }
            </div>
          `;
          allTalksList.appendChild(talkCard);
        });
      } catch (err) {
        console.error("Error fetching talks:", err);
        talksError.classList.remove("hidden");
      }
    }

    loadTalks();
  </script>
</body>
</html>
