<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talks | ChristLife Assemblies Cebu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
        }
        .font-serif {
            font-family: 'Merriweather', serif;
        }
        .nav-link {
            transition: color 0.3s, border-bottom-color 0.3s;
        }
        .nav-link:hover {
            color: #d69e2e; /* gold-500 */
            border-bottom-color: #d69e2e;
        }
        .nav-link.active {
            color: #d69e2e; /* gold-500 */
            border-bottom-color: #d69e2e;
        }
        /* Added for dynamically loaded cards */
        .talk-card {
            display: flex;
            flex-direction: column;
        }
        .talk-card-image {
            height: 12rem; /* 192px */
            width: 100%;
            object-fit: cover;
            border-top-left-radius: 0.5rem; /* rounded-lg */
            border-top-right-radius: 0.5rem; /* rounded-lg */
        }
        .talk-card-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 1.5rem; /* p-6 */
        }
        .talk-card-description {
            flex-grow: 1;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <header class="bg-white shadow-md sticky top-0 z-50">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center">
                <img src="logoooo onlyyy.png" alt="ChristLife Assemblies Logo" class="h-5 w-5 mr-3 rounded-full" onerror="this.onerror=null;this.src='https://placehold.co/40x40/d69e2e/ffffff?text=Logo';">
                <span class="text-2xl font-bold text-gray-800 font-serif">ChristLife Assemblies Cebu</span>
            </a>
            <div class="hidden md:flex space-x-8">
                <a href="index.html#about" class="nav-link text-gray-600 border-b-2 border-transparent">About Us</a>
                <a href="talks.html" class="nav-link text-gray-600 border-b-2 border-transparent active">Talks</a>
                <a href="evangelism.html" class="nav-link text-gray-600 border-b-2 border-transparent">Evangelism</a>
                <a href="index.html#events" class="nav-link text-gray-600 border-b-2 border-transparent">Events</a>
                <a href="index.html#gallery" class="nav-link text-gray-600 border-b-2 border-transparent">Gallery</a>
                <a href="index.html#contact" class="nav-link text-gray-600 border-b-2 border-transparent">Contact</a>
            </div>
            <button id="mobile-menu-button" class="md:hidden focus:outline-none">
                <i class="fas fa-bars text-2xl"></i>
            </button>
        </nav>
        <div id="mobile-menu" class="hidden md:hidden">
             <a href="index.html#about" class="block py-2 px-4 text-sm hover:bg-gray-100">About Us</a>
            <a href="talks.html" class="block py-2 px-4 text-sm hover:bg-gray-100">Talks</a>
            <a href="evangelism.html" class="block py-2 px-4 text-sm hover:bg-gray-100">Evangelism</a>
            <a href="index.html#events" class="block py-2 px-4 text-sm hover:bg-gray-100">Events</a>
            <a href="index.html#gallery" class="block py-2 px-4 text-sm hover:bg-gray-100">Gallery</a>
            <a href="index.html#contact" class="block py-2 px-4 text-sm hover:bg-gray-100">Contact</a>
        </div>
    </header>

    <main>
        <!-- Page Title Section -->
        <section class="py-20 bg-yellow-50">
            <div class="container mx-auto px-6 text-center">
                <h1 class="text-4xl font-bold font-serif text-gray-800">All Talks</h1>
                <p class="text-gray-600 mt-2">Browse our complete archive of messages.</p>
            </div>
        </section>

        <!-- All Talks Grid Section -->
        <section class="py-20">
            <div class="container mx-auto px-6">
                <!-- Dynamic Grid Container -->
                <div id="talks-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                    <!-- Loading Spinner -->
                    <div id="talks-loading" class="text-center col-span-1 md:col-span-2 lg:col-span-3 py-12">
                        <i class="fas fa-spinner animate-spin text-yellow-500 text-5xl"></i>
                        <p class="mt-4 text-gray-600 text-lg">Loading all talks...</p>
                    </div>
                    <!-- Talks will be injected here by JavaScript -->
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-gray-800 text-white">
        <div class="container mx-auto px-6 py-8">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <p class="text-center md:text-left">© 2025 ChristLife Assemblies Cebu. All Rights Reserved.</p>
                <div class="flex mt-4 md:mt-0 space-x-6">
                    <a href="https://www.facebook.com/ChristlifeAssembliesCebu" target="_blank" rel="noopener noreferrer" class="text-gray-400 hover:text-white"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="text-gray-400 hover:text-white"><i class="fab fa-youtube"></i></a>
                    <a href="#" class="text-gray-400 hover:text-white"><i class="fab fa-instagram"></i></a>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // Mobile menu toggle
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');

        mobileMenuButton.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });
    </script>

    <!-- ### NEW SCRIPT FOR FIREBASE ### -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInAnonymously, 
            signInWithCustomToken
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            getDocs, 
            query, 
            orderBy, 
            setLogLevel 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Config (UPDATED) ---
        // Check for Canvas-injected variables first
        const configStr = typeof __firebase_config !== 'undefined' 
            ? __firebase_config 
            : (typeof VITE_FIREBASE_CONFIG !== 'undefined' ? VITE_FIREBASE_CONFIG : 'null');
            
        const firebaseConfig = JSON.parse(configStr) || {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Check for Canvas-injected app ID first
        const appId = typeof __app_id !== 'undefined' 
            ? __app_id 
            : (typeof VITE_APP_ID !== 'undefined' ? VITE_APP_ID : 'default-app-id');

        // --- Initialize Firebase ---
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        setLogLevel('Debug');

        // --- UI Elements ---
        const talksList = document.getElementById('talks-list');
        const talksLoading = document.getElementById('talks-loading');

        // --- Helper Function to format date ---
        function formatTalkDate(dateString) {
            if (!dateString) return 'Undated';
            try {
                // Add T00:00:00 to ensure date is parsed in local timezone, not UTC
                const date = new Date(dateString + 'T00:00:00');
                return date.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            } catch (e) {
                console.warn("Could not parse date:", dateString);
                return dateString;
            }
        }

        // --- Fetch and Render All Talks ---
        async function fetchAllTalks() {
            try {
                const talksCollectionRef = collection(db, `artifacts/${appId}/public/data/talks`);
                // Query for all talks, ordered by 'createdAt' timestamp descending
                const q = query(talksCollectionRef, orderBy('createdAt', 'desc'));
                const querySnapshot = await getDocs(q);

                const talks = [];
                querySnapshot.forEach((doc) => {
                    talks.push({ id: doc.id, ...doc.data() });
                });

                // Clear loading spinner
                talksList.innerHTML = '';

                if (talks.length === 0) {
                    talksList.innerHTML = '<p class="text-center text-gray-600 col-span-1 md:col-span-2 lg:col-span-3">No talks found. Please check back later.</p>';
                    return;
                }

                // Render talks
                talks.forEach(talk => {
                    const talkCard = document.createElement('div');
                    talkCard.className = 'bg-white rounded-lg shadow-lg talk-card'; // Use talk-card for flex
                    
                    const formattedDate = formatTalkDate(talk.date);
                    const title = talk.title || 'Untitled Talk';
                    
                    // Use coverPhotoURL if it exists, otherwise use a placeholder
                    const imageURL = talk.coverPhotoURL || `https://placehold.co/600x400/d69e2e/ffffff?text=${encodeURIComponent(title.split(' ').slice(0,3).join(' '))}`;

                    let description = talk.description || 'No description available.';

                    talkCard.innerHTML = `
                        <img src="${imageURL}" alt="${title}" class="talk-card-image">
                        <div class="talk-card-content">
                            <div class="talk-card-description">
                                <h3 class="font-bold text-xl mb-2 font-serif">${title}</h3>
                                <p class="text-gray-500 text-sm mb-4">${talk.speaker || 'Unknown Speaker'} | ${formattedDate}</p>
                                <p class="text-gray-700 mb-4">${description}</p>
                            </div>
                            <a href="${talk.gdrive_link}" target="_blank" rel="noopener noreferrer" class="text-yellow-600 hover:text-yellow-700 font-semibold mt-auto">
                                Listen Now <i class="fas fa-arrow-right ml-1"></i>
                            </a>
                        </div>
                    `;
                    talksList.appendChild(talkCard);
                });

            } catch (error) {
                console.error("Error fetching all talks: ", error);
                talksLoading.innerHTML = '<p class="text-red-500 col-span-1 md:col-span-2 lg:col-span-3">Error loading talks. Please refresh the page.</p>';
            }
        }

        // --- Initial Load ---
        (async () => {
            // Sign in anonymously or with token to access Firestore
            try {
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth failed:", error);
            }
            
            // Fetch talks after auth
            fetchAllTalks();
        })();
    </script>

</body>
</html>
