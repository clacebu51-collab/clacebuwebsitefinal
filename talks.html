<!-- ✅ UPDATED SUPABASE SCRIPT WITH "LOAD MORE" FEATURE -->
<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  // --- Supabase configuration ---
  const SUPABASE_URL =
    typeof VITE_SUPABASE_URL !== "undefined"
      ? VITE_SUPABASE_URL
      : "https://upcjphjybqmwlwnhapht.supabase.co";

  const SUPABASE_ANON_KEY =
    typeof VITE_SUPABASE_ANON_KEY !== "undefined"
      ? VITE_SUPABASE_ANON_KEY
      : "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVwY2pwaGp5YnFtd2x3bmhhcGh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIyNjc3NDgsImV4cCI6MjA3Nzg0Mzc0OH0.MyBXSXaWrBGz8aWdUdaB-jwrlHvgloAvusL0a3gpsFA"; // ⬅️ paste your anon key here

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // --- UI Elements ---
  const allTalksList = document.getElementById("all-talks-list");
  const talksError = document.getElementById("talks-error");

  // --- Pagination Settings ---
  const PAGE_SIZE = 6;
  let currentPage = 0;
  let loading = false;
  let allLoaded = false;

  // --- Create Load More Button ---
  const loadMoreBtn = document.createElement("button");
  loadMoreBtn.textContent = "Load More";
  loadMoreBtn.className =
    "mt-10 px-6 py-3 bg-yellow-600 text-white font-semibold rounded-lg shadow hover:bg-yellow-700 transition block mx-auto";
  loadMoreBtn.style.display = "none";
  document.querySelector("section.py-20 .container").appendChild(loadMoreBtn);

  // --- Helper function to format date ---
  function formatTalkDate(dateString) {
    if (!dateString) return "Undated";
    try {
      const date = new Date(dateString + "T00:00:00");
      return date.toLocaleDateString("en-US", {
        year: "numeric",
        month: "long",
        day: "numeric",
      });
    } catch {
      return dateString;
    }
  }

  // --- Fetch and Render Talks with Pagination ---
  async function fetchTalksPage() {
    if (loading || allLoaded) return;
    loading = true;
    loadMoreBtn.textContent = "Loading...";

    try {
      const from = currentPage * PAGE_SIZE;
      const to = from + PAGE_SIZE - 1;

      const { data: talks, error } = await supabase
        .from("talks")
        .select("*")
        .order("created_at", { ascending: false })
        .range(from, to);

      if (error) throw error;

      // No more data
      if (!talks || talks.length === 0) {
        allLoaded = true;
        loadMoreBtn.textContent = "No more talks";
        loadMoreBtn.disabled = true;
        return;
      }

      // Show button if data exists
      loadMoreBtn.style.display = "block";
      loadMoreBtn.textContent = "Load More";

      talks.forEach((talk) => {
        const title = talk.title || "Untitled Talk";
        const imageURL =
          talk.cover_photo_u ||
          `https://placehold.co/600x400/d69e2e/ffffff?text=${encodeURIComponent(
            title.split(" ").slice(0, 3).join(" ")
          )}`;
        const formattedDate = formatTalkDate(talk.date);

        const talkCard = document.createElement("div");
        talkCard.className =
          "bg-white rounded-lg shadow-lg flex flex-col overflow-hidden";

        talkCard.innerHTML = `
          <img src="${imageURL}" alt="${title}" class="talk-card-image"
            onerror="this.onerror=null;this.src='https://placehold.co/600x400/d69e2e/ffffff?text=Image+Error';">
          <div class="p-6 flex-grow flex flex-col">
            <div class="flex-grow">
              <h3 class="font-bold text-xl mb-2 font-serif">${title}</h3>
              <p class="text-gray-500 text-sm mb-4">
                ${talk.speaker || "Unknown Speaker"} | ${formattedDate}
              </p>
              <p class="text-gray-700 mb-4 talk-card-description">
                ${talk.description || "No description available."}
              </p>
            </div>
            ${
              talk.gdrive_link
                ? `<a href="${talk.gdrive_link}" target="_blank" rel="noopener noreferrer"
                     class="text-yellow-600 hover:text-yellow-700 font-semibold mt-auto">
                     Listen Now <i class="fas fa-arrow-right ml-1"></i></a>`
                : ""
            }
          </div>
        `;

        allTalksList.appendChild(talkCard);
      });

      currentPage++;
    } catch (err) {
      console.error("Error fetching talks:", err);
      talksError.textContent = "Error: Could not load talks.";
      talksError.classList.remove("hidden");
    } finally {
      loading = false;
      if (!allLoaded) loadMoreBtn.textContent = "Load More";
    }
  }

  // --- Load More Click Event ---
  loadMoreBtn.addEventListener("click", fetchTalksPage);

  // --- Initial Load ---
  fetchTalksPage();
</script>
